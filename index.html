<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAP JALAN</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D2F5F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIAP JALAN">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0D2F5F;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      padding: 45px 30px 35px;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #F5B400;
      padding: 8px;
      background: white;
      margin: 0 auto 18px;
      box-shadow: 0 4px 20px rgba(245,180,0,0.2);
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
    h1 .siap { color: #0D2F5F; }
    h1 .jalan { color: #F5B400; }
    .subtitle { color: #6c757d; font-size: 13px; margin-bottom: 5px; letter-spacing: 1px; }
    .badge {
      display: inline-block;
      background: #F5B400;
      color: #0D2F5F;
      padding: 3px 16px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #0D2F5F, #1a4a7a);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      width: 100%;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(13,47,95,0.4); }
    .btn:active { transform: scale(0.97); }
    .btn i { font-size: 20px; }
    .btn-success { background: linear-gradient(135deg, #28a745, #1e7e34); margin-top: 12px; }
    .btn-success:hover { box-shadow: 0 10px 30px rgba(40,167,69,0.4); }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #adb5bd;
      border-top: 1px solid #f0f0f0;
      padding-top: 18px;
      line-height: 1.8;
    }
    .info i { color: #F5B400; margin-right: 4px; }
    .status-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }
    .session-info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
    }
    .session-info span { color: #0D2F5F; font-weight: 600; }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(13,47,95,0.92);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #loadingOverlay .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top: 5px solid #F5B400;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loadingOverlay p { color: white; margin-top: 20px; font-size: 14px; opacity: 0.8; }
    #clearCacheBtn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 15px;
      transition: all 0.3s ease;
    }
    #clearCacheBtn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }
    @media (max-width: 480px) {
      .container { padding: 30px 20px 25px; }
      h1 { font-size: 26px; }
      .logo { width: 80px; height: 80px; }
    }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Membuka aplikasi...</p>
    <button id="clearCacheBtn" onclick="clearCacheAndReload()">🔄 Clear Cache & Reload</button>
  </div>

  <!-- MAIN CARD -->
  <div class="container">
    <div class="logo">
      <img src="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png" alt="Logo SIAP JALAN">
    </div>
    
    <h1>
      <span class="siap">SIAP</span>
      <span class="jalan">JALAN</span>
    </h1>
    <p class="subtitle">Sistem Integrasi Aduan &amp; Penanganan Jalan</p>
    <div class="badge">Binamarga</div>
    
    <!-- Tombol Buka Aplikasi -->
    <button class="btn" id="openAppBtn">
      <i class="fas fa-rocket"></i>
      Buka Aplikasi
    </button>
    
    <!-- Tombol Install -->
    <button class="btn btn-success" id="installBtn" style="display:none;">
      <i class="fas fa-download"></i>
      Instal Aplikasi
    </button>
    
    <div class="info">
      <i class="fas fa-shield-alt"></i> Aman &amp; Terpercaya
      <br>
      <i class="fas fa-mobile-alt"></i> Dapat diinstal di HP
      <br>
      <span id="installStatus" style="display:none;" class="status-badge">
        <i class="fas fa-check-circle"></i> Sudah Terinstal
      </span>
    </div>
    
    <div class="session-info">
      <i class="fas fa-clock" style="color:#F5B400;"></i>
      Sesi berakhir setelah <span>30 menit</span> tidak aktif
    </div>
    
    <div style="margin-top:8px;font-size:11px;color:#ced4da;">
      v2.6.0 &bull; 
      <a href="#" onclick="installApp();return false;" style="color:#0D2F5F;font-weight:600;text-decoration:underline;">Instal</a>
      &bull;
      <a href="#" onclick="clearCacheAndReload();return false;" style="color:#dc3545;font-weight:600;text-decoration:underline;">Clear Cache</a>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI - URL WEB APP TERBARU
    // ============================================================
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwMRu1M1Tzq_qptbcna4M6bpKj3gQnlc9MtMG1FerSxboiwjhvU2cv4n34pXz5FpC88p4/exec'; 
    const SESSION_TIMEOUT = 30 * 60 * 1000;
    const WARNING_TIME = 5 * 60 * 1000;
    
    // ============================================================
    // CLEAR CACHE & RELOAD
    // ============================================================
    function clearCacheAndReload() {
      if (confirm('⚠️ Clear cache akan menghapus data tersimpan dan memuat ulang halaman. Lanjutkan?')) {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              caches.delete(names[i]);
            }
          });
        }
        localStorage.clear();
        window.location.reload(true);
      }
    }

    // ============================================================
    // SESSION MANAGEMENT
    // ============================================================
    let sessionTimer = null;
    let warningTimer = null;
    let isWarningShown = false;
    let lastActivity = Date.now();
    
    function resetSessionTimer() {
      lastActivity = Date.now();
      if (sessionTimer) { clearTimeout(sessionTimer); sessionTimer = null; }
      if (warningTimer) { clearTimeout(warningTimer); warningTimer = null; }
      warningTimer = setTimeout(function() { showWarning(); }, SESSION_TIMEOUT - WARNING_TIME);
      sessionTimer = setTimeout(function() { performLogout(); }, SESSION_TIMEOUT);
    }
    
    function showWarning() {
      if (isWarningShown) return;
      isWarningShown = true;
      var msg = '⏰ Sesi akan berakhir! Anda akan logout dalam 5 menit. Klik "OK" untuk perpanjang sesi.';
      if (confirm(msg)) {
        resetSessionTimer();
        showToast('✅ Sesi diperpanjang!');
      } else {
        performLogout();
      }
    }
    
    function performLogout() {
      if (sessionTimer) { clearTimeout(sessionTimer); sessionTimer = null; }
      if (warningTimer) { clearTimeout(warningTimer); warningTimer = null; }
      loadingOverlay.style.display = 'flex';
      loadingOverlay.querySelector('p').textContent = 'Logout...';
      window.location.href = APP_URL + '?logout=true';
      setTimeout(function() { window.location.href = APP_URL; }, 3000);
    }
    
    function handleUserActivity() { resetSessionTimer(); }
    
    ['click','mousemove','keydown','scroll','touchstart','touchmove'].forEach(function(e) {
      document.addEventListener(e, handleUserActivity);
    });
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) resetSessionTimer();
    });
    window.addEventListener('online', resetSessionTimer);
    
    function showToast(message) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 24px;border-radius:10px;font-size:14px;z-index:9999;max-width:90%;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3);';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(function(){toast.remove();},300); }, 3000);
    }

    // ============================================================
    // BUKA APLIKASI
    // ============================================================
    var openBtn = document.getElementById('openAppBtn');
    var loadingOverlay = document.getElementById('loadingOverlay');
    
    openBtn.addEventListener('click', function() {
      loadingOverlay.style.display = 'flex';
      loadingOverlay.querySelector('p').textContent = 'Membuka aplikasi...';
      resetSessionTimer();
      window.location.href = APP_URL;
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
        if (window.location.href.indexOf('siapjalan-pwa') !== -1) {
          window.open(APP_URL, '_blank');
        }
      }, 3000);
    });

    // ============================================================
    // INSTALL APP (PWA)
    // ============================================================
    var deferredPrompt;
    var installBtn = document.getElementById('installBtn');
    var installStatus = document.getElementById('installStatus');
    
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installStatus.style.display = 'inline-block';
      installBtn.style.display = 'none';
    }
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });
    
    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
            installStatus.style.display = 'inline-block';
          }
          deferredPrompt = null;
        });
      } else {
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        var msg = '📱 Cara instal SIAP JALAN:\n\n';
        if (isMobile) {
          msg += '1. Buka Chrome / Safari\n2. Tap menu (⋮ atau ⬆️)\n3. Pilih "Tambahkan ke Layar Utama"\n4. Tap "Tambahkan"';
        } else {
          msg += '1. Buka Chrome / Edge\n2. Klik ikon install (📲) di address bar\n3. Klik "Install"';
        }
        alert(msg);
      }
    }
    
    installBtn.addEventListener('click', installApp);

    // ============================================================
    // REGISTER SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
          console.log('✅ Service Worker terdaftar!', reg);
        })
        .catch(function(err) {
          console.log('❌ Gagal Service Worker:', err);
        });
    }

    // ============================================================
    // START SESSION TIMER
    // ============================================================
    resetSessionTimer();
    console.log('🚀 SIAP JALAN PWA v2.6 siap digunakan!');
    console.log('🔗 URL Web App: ' + APP_URL);
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</body>
</html>
