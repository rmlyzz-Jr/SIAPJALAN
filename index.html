<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAP JALAN</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D2F5F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIAP JALAN">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0D2F5F;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      text-align: center;
      padding: 45px 30px 35px;
    }
    
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #F5B400;
      padding: 8px;
      background: white;
      margin: 0 auto 18px;
      box-shadow: 0 4px 20px rgba(245,180,0,0.2);
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    
    h1 .siap { color: #0D2F5F; }
    h1 .jalan { color: #F5B400; }
    
    .subtitle {
      color: #6c757d;
      font-size: 13px;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }
    
    .badge {
      display: inline-block;
      background: #F5B400;
      color: #0D2F5F;
      padding: 3px 16px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }
    
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      background: linear-gradient(135deg, #0D2F5F, #1a4a7a);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(13,47,95,0.4);
    }
    
    .btn:active {
      transform: scale(0.97);
    }
    
    .btn i {
      font-size: 20px;
    }
    
    .btn-success {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      margin-top: 12px;
    }
    
    .btn-success:hover {
      box-shadow: 0 10px 30px rgba(40,167,69,0.4);
    }
    
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #adb5bd;
      border-top: 1px solid #f0f0f0;
      padding-top: 18px;
      line-height: 1.8;
    }
    
    .info i {
      color: #F5B400;
      margin-right: 4px;
    }
    
    .status-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }
    
    .session-info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
    }
    
    .session-info span {
      color: #0D2F5F;
      font-weight: 600;
    }
    
    /* SESSION TIMEOUT WARNING */
    #sessionWarning {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff3cd;
      color: #856404;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 90%;
      text-align: center;
      z-index: 1000;
      border-left: 5px solid #ffc107;
      animation: slideUp 0.4s ease;
    }
    
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(30px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
    
    #sessionWarning .warning-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }
    
    #sessionWarning .warning-text {
      font-size: 13px;
    }
    
    #sessionWarning .warning-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    #sessionWarning .warning-actions button {
      padding: 8px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #sessionWarning .btn-extend {
      background: #0D2F5F;
      color: white;
    }
    
    #sessionWarning .btn-extend:hover {
      background: #1a4a7a;
    }
    
    #sessionWarning .btn-logout-now {
      background: #dc3545;
      color: white;
    }
    
    #sessionWarning .btn-logout-now:hover {
      background: #c82333;
    }
    
    /* LOADING OVERLAY */
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(13,47,95,0.92);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    #loadingOverlay .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top: 5px solid #F5B400;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #loadingOverlay p {
      color: white;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 30px 20px 25px;
      }
      h1 {
        font-size: 26px;
      }
      .logo {
        width: 80px;
        height: 80px;
      }
      #sessionWarning {
        bottom: 15px;
        padding: 14px 18px;
      }
      #sessionWarning .warning-actions {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>

  <!-- SESSION WARNING -->
  <div id="sessionWarning">
    <div class="warning-title">⏰ Sesi Akan Berakhir</div>
    <div class="warning-text" id="warningText">Anda akan logout dalam 5 menit karena tidak ada aktivitas.</div>
    <div class="warning-actions">
      <button class="btn-extend" onclick="extendSession()">Lanjutkan Sesi</button>
      <button class="btn-logout-now" onclick="logoutNow()">Logout Sekarang</button>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Membuka aplikasi...</p>
  </div>

  <!-- MAIN CARD -->
  <div class="container">
    <div class="logo">
      <img src="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png" alt="Logo SIAP JALAN">
    </div>
    
    <h1>
      <span class="siap">SIAP</span>
      <span class="jalan">JALAN</span>
    </h1>
    <p class="subtitle">Sistem Integrasi Aduan &amp; Penanganan Jalan</p>
    <div class="badge">Binamarga</div>
    
    <!-- Tombol Buka Aplikasi -->
    <button class="btn" id="openAppBtn">
      <i class="fas fa-rocket"></i>
      Buka Aplikasi
    </button>
    
    <!-- Tombol Install -->
    <button class="btn btn-success" id="installBtn" style="display:none;">
      <i class="fas fa-download"></i>
      Instal Aplikasi
    </button>
    
    <!-- Status -->
    <div class="info">
      <i class="fas fa-shield-alt"></i> Aman &amp; Terpercaya
      <br>
      <i class="fas fa-mobile-alt"></i> Dapat diinstal di HP
      <br>
      <span id="installStatus" style="display:none;" class="status-badge">
        <i class="fas fa-check-circle"></i> Sudah Terinstal
      </span>
    </div>
    
    <div class="session-info">
      <i class="fas fa-clock" style="color:#F5B400;"></i>
      Sesi berakhir setelah <span>30 menit</span> tidak aktif
    </div>
    
    <div style="margin-top:8px;font-size:11px;color:#ced4da;">
      v2.5.0 &bull; 
      <a href="#" onclick="installApp();return false;" style="color:#0D2F5F;font-weight:600;text-decoration:underline;">Instal</a>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI - URL WEB APP BARU
    // ============================================================
    const APP_URL = 'https://script.google.com/macros/s/AKfycbz5Pn7HXfpr_mMt6w3mTGKmrgxOhRx_dsxOznrY11koXkiys6kGoMsvz_AV6ZmdNAEQXg/exec';
    const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 menit
    const WARNING_TIME = 5 * 60 * 1000; // 5 menit sebelum logout
    
    // ============================================================
    // SESSION MANAGEMENT
    // ============================================================
    let sessionTimer = null;
    let warningTimer = null;
    let isWarningShown = false;
    let lastActivity = Date.now();
    
    function resetSessionTimer() {
      lastActivity = Date.now();
      
      if (sessionTimer) {
        clearTimeout(sessionTimer);
        sessionTimer = null;
      }
      if (warningTimer) {
        clearTimeout(warningTimer);
        warningTimer = null;
      }
      
      hideWarning();
      
      warningTimer = setTimeout(function() {
        showWarning();
      }, SESSION_TIMEOUT - WARNING_TIME);
      
      sessionTimer = setTimeout(function() {
        performLogout();
      }, SESSION_TIMEOUT);
      
      console.log('🔄 Session timer direset. Logout dalam ' + (SESSION_TIMEOUT/60000) + ' menit');
    }
    
    function showWarning() {
      if (isWarningShown) return;
      isWarningShown = true;
      
      const warning = document.getElementById('sessionWarning');
      const text = document.getElementById('warningText');
      
      const timeLeft = Math.ceil((SESSION_TIMEOUT - (Date.now() - lastActivity)) / 60000);
      text.textContent = 'Anda akan logout dalam ' + timeLeft + ' menit karena tidak ada aktivitas.';
      
      warning.style.display = 'block';
      
      let countdown = timeLeft;
      const countdownInterval = setInterval(function() {
        countdown--;
        if (countdown > 0) {
          text.textContent = 'Anda akan logout dalam ' + countdown + ' menit karena tidak ada aktivitas.';
        } else {
          clearInterval(countdownInterval);
        }
      }, 60000);
      
      warning._countdownInterval = countdownInterval;
    }
    
    function hideWarning() {
      const warning = document.getElementById('sessionWarning');
      if (warning._countdownInterval) {
        clearInterval(warning._countdownInterval);
        warning._countdownInterval = null;
      }
      warning.style.display = 'none';
      isWarningShown = false;
    }
    
    function extendSession() {
      resetSessionTimer();
      showToast('✅ Sesi diperpanjang!');
    }
    
    function logoutNow() {
      hideWarning();
      performLogout();
    }
    
    function performLogout() {
      console.log('🚪 Logout otomatis karena tidak aktif');
      
      if (sessionTimer) {
        clearTimeout(sessionTimer);
        sessionTimer = null;
      }
      if (warningTimer) {
        clearTimeout(warningTimer);
        warningTimer = null;
      }
      hideWarning();
      
      loadingOverlay.style.display = 'flex';
      loadingOverlay.querySelector('p').textContent = 'Logout...';
      
      window.location.href = APP_URL + '?logout=true';
      
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
        window.location.href = APP_URL;
      }, 3000);
    }
    
    // ============================================================
    // DETEKSI AKTIVITAS USER
    // ============================================================
    function handleUserActivity() {
      resetSessionTimer();
    }
    
    const events = ['click', 'mousemove', 'keydown', 'scroll', 'touchstart', 'touchmove'];
    events.forEach(function(eventName) {
      document.addEventListener(eventName, handleUserActivity);
    });
    
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        resetSessionTimer();
      }
    });
    
    window.addEventListener('online', function() {
      resetSessionTimer();
    });
    
    // ============================================================
    // TOAST NOTIFICATION
    // ============================================================
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position: fixed;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 9999;
        max-width: 90%;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        animation: fadeIn 0.3s ease;
      `;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(function() { toast.remove(); }, 300);
      }, 3000);
    }

    // ============================================================
    // BUKA APLIKASI
    // ============================================================
    const openBtn = document.getElementById('openAppBtn');
    
    openBtn.addEventListener('click', function() {
      loadingOverlay.style.display = 'flex';
      loadingOverlay.querySelector('p').textContent = 'Membuka aplikasi...';
      
      resetSessionTimer();
      
      window.location.href = APP_URL;
      
      setTimeout(function() {
        loadingOverlay.style.display = 'none';
        if (window.location.href.indexOf('siapjalan-pwa') !== -1) {
          window.open(APP_URL, '_blank');
        }
      }, 3000);
    });

    // ============================================================
    // INSTALL APP (PWA)
    // ============================================================
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const installStatus = document.getElementById('installStatus');
    
    if (window.matchMedia('(display-mode: standalone)').matches) {
      installStatus.style.display = 'inline-block';
      installBtn.style.display = 'none';
    }
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
      console.log('📱 App install prompt tersedia');
    });
    
    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('✅ User menerima install prompt');
            installBtn.style.display = 'none';
            installStatus.style.display = 'inline-block';
          } else {
            console.log('❌ User menolak install prompt');
          }
          deferredPrompt = null;
        });
      } else {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let msg = '📱 Cara instal SIAP JALAN:\n\n';
        if (isMobile) {
          msg += '1. Buka Chrome / Safari\n';
          msg += '2. Tap menu (⋮ atau ⬆️)\n';
          msg += '3. Pilih "Tambahkan ke Layar Utama"\n';
          msg += '4. Tap "Tambahkan"';
        } else {
          msg += '1. Buka Chrome / Edge\n';
          msg += '2. Klik ikon install (📲) di address bar\n';
          msg += '3. Klik "Install"';
        }
        alert(msg);
      }
    }
    
    installBtn.addEventListener('click', installApp);

    // ============================================================
    // REGISTER SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
          console.log('✅ Service Worker terdaftar!', reg);
        })
        .catch(function(err) {
          console.log('❌ Gagal Service Worker:', err);
        });
    }

    // ============================================================
    // START SESSION TIMER
    // ============================================================
    resetSessionTimer();
    
    console.log('🚀 SIAP JALAN PWA v2.5 dengan Auto-Logout siap digunakan!');
    console.log('⏰ Session timeout: ' + (SESSION_TIMEOUT/60000) + ' menit');
    console.log('🔗 URL Web App: ' + APP_URL);
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</body>
</html>
