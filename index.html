<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAP JALAN</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D2F5F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIAP JALAN">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    
    /* ============================================================
       LOADING SCREEN
    ============================================================ */
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0D2F5F;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    
    #loadingScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    #loadingScreen .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 4px solid #F5B400;
      padding: 8px;
      background: white;
      margin-bottom: 20px;
    }
    
    #loadingScreen .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    #loadingScreen h1 {
      color: white;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    #loadingScreen h1 .siap { color: #F5B400; }
    #loadingScreen h1 .jalan { color: white; }
    
    #loadingScreen .sub {
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #F5B400;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #loadingScreen .progress-text {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      margin-top: 15px;
    }
    
    /* ============================================================
       IFRAME CONTAINER
    ============================================================ */
    #appContainer {
      width: 100%;
      height: 100%;
      display: none;
    }
    
    #appContainer iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    
    /* ============================================================
       ERROR SCREEN
    ============================================================ */
    #errorScreen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #f8f9fa;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 30px;
      text-align: center;
      z-index: 999;
    }
    
    #errorScreen i {
      font-size: 48px;
      color: #dc3545;
      margin-bottom: 20px;
    }
    
    #errorScreen h2 {
      color: #333;
      margin-bottom: 10px;
    }
    
    #errorScreen p {
      color: #666;
      max-width: 400px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    
    #errorScreen .btn {
      padding: 12px 30px;
      background: #0D2F5F;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    #errorScreen .btn:hover {
      background: #1a4a7a;
      transform: translateY(-2px);
    }
    
    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 768px) {
      #loadingScreen .logo {
        width: 60px;
        height: 60px;
      }
      #loadingScreen h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       LOADING SCREEN
  ============================================================ -->
  <div id="loadingScreen">
    <div class="logo">
      <img src="https://i.ibb.co.com/XZTqS2bX/LOGO-SJ.png" alt="Logo SIAP JALAN">
    </div>
    <h1>
      <span class="siap">SIAP</span>
      <span class="jalan">JALAN</span>
    </h1>
    <div class="sub">Binamarga</div>
    <div class="loader"></div>
    <div class="progress-text" id="progressText">Memuat aplikasi...</div>
  </div>

  <!-- ============================================================
       ERROR SCREEN
  ============================================================ -->
  <div id="errorScreen">
    <i class="fas fa-wifi"></i>
    <h2>Koneksi Terputus</h2>
    <p>Periksa koneksi internet Anda untuk mengakses SIAP JALAN.</p>
    <button class="btn" onclick="reloadApp()">
      <i class="fas fa-sync" style="margin-right:8px;"></i> Coba Lagi
    </button>
  </div>

  <!-- ============================================================
       IFRAME CONTAINER
  ============================================================ -->
  <div id="appContainer">
    <iframe id="appIframe" src="about:blank"></iframe>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const APP_URL = 'https://script.google.com/macros/s/AKfycbxaPxtTpQgWpwfMPKLCR15QiCEqL4j6UT0qegDi46EaOWft7jLbcA8Xyg5Z4iSrv84N7Q/exec';
    const LOADING_TIMEOUT = 15000; // 15 detik
    let loadTimeout;

    // ============================================================
    // ELEMEN
    // ============================================================
    const loadingScreen = document.getElementById('loadingScreen');
    const appContainer = document.getElementById('appContainer');
    const errorScreen = document.getElementById('errorScreen');
    const iframe = document.getElementById('appIframe');
    const progressText = document.getElementById('progressText');

    // ============================================================
    // LOAD APP
    // ============================================================
    function loadApp() {
      progressText.textContent = 'Menyiapkan aplikasi...';
      
      // Set timeout untuk loading
      loadTimeout = setTimeout(function() {
        progressText.textContent = 'Loading memakan waktu lebih lama...';
        // Coba lagi setelah 5 detik
        setTimeout(function() {
          if (loadingScreen.style.display !== 'none') {
            progressText.textContent = 'Masih memuat...';
          }
        }, 5000);
      }, 5000);

      // Load iframe
      iframe.src = APP_URL;
      
      // Event listener untuk iframe
      iframe.addEventListener('load', function() {
        clearTimeout(loadTimeout);
        loadingScreen.classList.add('hidden');
        setTimeout(function() {
          loadingScreen.style.display = 'none';
          appContainer.style.display = 'block';
          progressText.textContent = 'Aplikasi siap digunakan!';
        }, 500);
      });

      // Error handling - jika iframe gagal load
      iframe.addEventListener('error', function() {
        clearTimeout(loadTimeout);
        showError('Gagal memuat aplikasi');
      });

      // Fallback: jika loading terlalu lama
      setTimeout(function() {
        if (loadingScreen.style.display !== 'none') {
          // Cek apakah iframe sudah mulai loading
          try {
            if (iframe.contentWindow.location.href === 'about:blank') {
              showError('Waktu muat habis. Periksa koneksi Anda.');
            }
          } catch(e) {
            // Cross-origin, biarkan saja
          }
        }
      }, LOADING_TIMEOUT);
    }

    // ============================================================
    // SHOW ERROR
    // ============================================================
    function showError(message) {
      clearTimeout(loadTimeout);
      loadingScreen.style.display = 'none';
      errorScreen.style.display = 'flex';
      document.querySelector('#errorScreen p').textContent = message || 'Periksa koneksi internet Anda.';
    }

    // ============================================================
    // RELOAD APP
    // ============================================================
    function reloadApp() {
      errorScreen.style.display = 'none';
      loadingScreen.style.display = 'flex';
      loadingScreen.classList.remove('hidden');
      progressText.textContent = 'Mencoba memuat ulang...';
      iframe.src = 'about:blank';
      setTimeout(function() {
        loadApp();
      }, 500);
    }

    // ============================================================
    // REGISTER SERVICE WORKER
    // ============================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(reg) {
          console.log('✅ Service Worker terdaftar!', reg);
        })
        .catch(function(err) {
          console.log('❌ Gagal Service Worker:', err);
        });
    }

    // ============================================================
    // INSTALL APP (PWA)
    // ============================================================
    let deferredPrompt;
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      console.log('📱 App install prompt tersedia');
    });

    // ============================================================
    // OFFLINE / ONLINE DETECTION
    // ============================================================
    window.addEventListener('online', function() {
      console.log('🌐 Kembali online');
      if (errorScreen.style.display === 'flex') {
        reloadApp();
      }
    });
    
    window.addEventListener('offline', function() {
      console.log('📴 Offline mode');
      showError('Anda sedang offline. Periksa koneksi internet.');
    });

    // ============================================================
    // START APP
    // ============================================================
    // Cek koneksi awal
    if (!navigator.onLine) {
      showError('Anda sedang offline. Periksa koneksi internet.');
    } else {
      loadApp();
    }

    console.log('🚀 SIAP JALAN PWA v2.2 siap digunakan!');
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</body>
</html>
